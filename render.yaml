services:
  - type: web
    name: lunaart-terminal
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: lunaart-postgres
          property: connectionString

databases:
  - name: lunaart-postgres
    plan: free
    databaseName: lunaart
    user: lunaart
    region: oregon
